<!DOCTYPE html>
<html>
<body>

<input id="x" placeholder="Enter number">
<button onclick="check()">Check</button>
<p id="msg"></p>

<script>
function check() {
  try {
    let v = document.getElementById("x").value;
    if (isNaN(v)) throw "Not a number";
    document.getElementById("msg").innerText = "Valid";
  } catch (e) {
    document.getElementById("msg").innerText = "Error";
  }
}
</script>

</body>
</html>
